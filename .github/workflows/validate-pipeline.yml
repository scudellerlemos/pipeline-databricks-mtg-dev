name: CI/CD Pipeline - Magic Card Game

on:
  pull_request:
    branches: [ main ]
    # SEM filtro de paths de proposito: "validate" e required status check na
    # main. Um PR que so mexe em README nao dispararia o workflow, o check
    # nunca reportaria e o PR ficaria bloqueado pra sempre, sem mensagem.
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/DAGs/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

# Dois merges seguidos na main = dois `jobs reset` correndo nos mesmos 5 jobs.
# cancel-in-progress: false porque cancelar um deploy no meio deixa parte dos
# jobs na versao nova e parte na velha - pior que esperar.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # ============================================================================
  # VALIDACAO ESTATICA (PR e push na main)
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    # Sem `environment:` de proposito: este job nao le secret nenhum. Amarrar
    # ele no environment Databricks faria todo PR esperar aprovacao manual no
    # dia em que esse environment ganhar required reviewer.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # requests vinha de carona no pacote databricks-cli, que saiu daqui.
      # ingestion_utils importa direto, entao virou dependencia declarada.
      run: pip install pyyaml==6.0.2 ruff==0.6.9 pytest==8.3.3 requests==2.32.3

    - name: Validate YAML syntax
      run: |
        python -c "
        import yaml
        for f in ['.github/DAGs/stage.yml', '.github/DAGs/bronze.yml', '.github/DAGs/pipeline.yml', '.github/DAGs/silver.yml', '.github/DAGs/gold.yml']:
            yaml.safe_load(open(f, 'r', encoding='utf-8'))
        "
        echo "✅ YAML syntax is valid"

    - name: Validate pipeline structure, notebooks, cluster and git config
      run: python .github/scripts/validate_dag.py

    - name: Lint notebook Python cells
      run: python .github/scripts/lint_notebooks.py

    - name: Run unit tests
      run: python -m pytest src .github/scripts -q

    - name: Comment PR with validation results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## ✅ Validação estática concluída

          - ✅ Sintaxe YAML válida
          - ✅ Estrutura do pipeline, notebooks, cluster e git
          - ✅ Lint estático das células Python (ruff F821/F822/F823)
          - ✅ Suíte de testes unitários (pytest)

          ⚠️ Nada foi executado num cluster. O smoke test roda no merge.`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # ============================================================================
  # DEPLOY EM DEV - todo push na main. Nao ha aprovacao exigida aqui (a main
  # nao pede review): o portao humano vive no environment Databricks-Prod, no
  # repo de controle, e vale so pra producao.
  # ============================================================================
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: Databricks
    permissions:
      contents: read

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # Destino do alerta de falha injetado em todo job pelo deploy.py.
      # Vazio = os jobs sobem sem on_failure e o deploy grita no log.
      MTG_ALERT_EMAIL: ${{ vars.MTG_ALERT_EMAIL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: pip install pyyaml==6.0.2

    # CLI nova (binario Go), nao o pacote pip `databricks-cli`, que esta
    # deprecado e so le DATABRICKS_TOKEN. A tag pinada e a MESMA versao que
    # roda na maquina de quem desenvolve - CI e local divergirem de CLI e
    # exatamente como o deploy.py acabou tendo dois caminhos de comando.
    - name: Instalar Databricks CLI
      uses: databricks/setup-cli@v1.16.1

    # Sem "teste de conexao": `databricks jobs list || echo ok` passava sempre,
    # inclusive com token morto. A primeira chamada do deploy.py falha com a
    # mensagem de verdade da API, que e mais util.
    - name: Deploy dos jobs em dev
      run: python .github/scripts/deploy.py

    # O deploy prova que o job esta configurado certo. Isto prova que o
    # ambiente sobe, que as env vars chegaram no cluster e que o Unity Catalog
    # deixa gravar - as tres coisas que nenhuma validacao estatica alcanca.
    - name: Smoke test no ambiente deployado
      run: python .github/scripts/smoke.py

    - name: Resumo
      run: |
        {
          echo "## 🚀 Deploy em dev concluído"
          echo ""
          echo "- Jobs: MTG_STAGE, MTG_BRONZE, MTG_SILVER, MTG_GOLD, MTG_PIPELINE"
          echo "- Catálogo: \`mtg_dev\` · schedule PAUSADO (dev roda sob demanda)"
          echo "- Smoke test: cluster subiu, escreveu e leu no catálogo"
          echo "- Alerta de falha: \`${MTG_ALERT_EMAIL:-NÃO CONFIGURADO}\`"
        } >> "$GITHUB_STEP_SUMMARY"
