name: CI/CD Pipeline - Magic Card Game

on:
  pull_request:
    branches: [ main ]
    # Sem filtro de paths: "validate" e required status check na main e precisa
    # reportar em todo PR, senao o PR fica bloqueado.
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/DAGs/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/requirements-ci.txt'
      # Nao afeta dev, mas a promocao pra prd depende deste run.
      - '.github/prd/**'

# Um deploy por vez, sem cancelar o que esta rodando: deploy interrompido
# deixa parte dos jobs na versao nova e parte na velha.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # ============================================================================
  # VALIDACAO ESTATICA (PR e push na main)
  # ============================================================================
  validate:
    runs-on: ubuntu-latest
    # Sem `environment:`: nao le secrets, e assim nao herda aprovacao manual do environment.
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r .github/requirements-ci.txt

    - name: Validate YAML syntax
      run: |
        python -c "
        import yaml
        for f in ['.github/DAGs/stage.yml', '.github/DAGs/bronze.yml', '.github/DAGs/pipeline.yml', '.github/DAGs/silver.yml', '.github/DAGs/gold.yml']:
            yaml.safe_load(open(f, 'r', encoding='utf-8'))
        "
        echo "YAML syntax is valid"

    - name: Validate pipeline structure, notebooks, cluster and git config
      run: python .github/scripts/validate_dag.py

    - name: Lint notebook Python cells
      run: python .github/scripts/lint_notebooks.py

    - name: Run unit tests
      run: python -m pytest src .github/scripts -q

    - name: Comment PR with validation results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## Validação estática concluída

          - Sintaxe YAML válida
          - Estrutura do pipeline, notebooks, cluster e git
          - Lint estático das células Python (ruff F821/F822/F823)
          - Suíte de testes unitários (pytest)

          Nada foi executado num cluster. O smoke test roda no merge.`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # ============================================================================
  # DEPLOY EM DEV - todo push de codigo na main, sem aprovacao (ADR-007).
  # ============================================================================
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: Databricks
    permissions:
      contents: read

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      # Email do alerta on_failure de todos os jobs. Vazio = sem alerta (o deploy avisa no log).
      MTG_ALERT_EMAIL: ${{ vars.MTG_ALERT_EMAIL }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: pip install -r .github/requirements-ci.txt

    # CLI nova (binario Go), nao o pacote pip `databricks-cli` (deprecado).
    # Versao pinada igual a usada localmente.
    - name: Instalar Databricks CLI
      uses: databricks/setup-cli@v1.16.1

    # A conexao e validada pelo proprio deploy.py, que falha com o erro da API.
    - name: Deploy dos jobs em dev
      run: python .github/scripts/deploy.py

    # Sobe um cluster e confere env vars e escrita no Unity Catalog (ver smoke.py).
    - name: Smoke test no ambiente deployado
      run: python .github/scripts/smoke.py

    - name: Resumo
      run: |
        {
          echo "## Deploy em dev concluído"
          echo ""
          echo "- Jobs: MTG_STAGE, MTG_BRONZE, MTG_SILVER, MTG_GOLD, MTG_PIPELINE"
          echo "- Catálogo: \`mtg_dev\` · schedule PAUSADO (dev roda sob demanda)"
          echo "- Smoke test: cluster subiu, escreveu e leu no catálogo"
          echo "- Alerta de falha: \`${MTG_ALERT_EMAIL:-NÃO CONFIGURADO}\`"
        } >> "$GITHUB_STEP_SUMMARY"
