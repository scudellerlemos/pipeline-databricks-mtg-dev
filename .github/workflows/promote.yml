name: Promover tag para produção

# Merge na main = producao. Quando o CI da main termina verde (validacao +
# deploy de dev), publica o snapshot desse commit no repo de producao
# (pipeline-databricks-mtg-prd): copia o codigo, commita, cria uma tag
# prd-<data>-<sha> (e ela que o rollback redeploya) e dispara o deploy. Os
# jobs de prod leem de la, entao nada que aconteca neste repo depois - tag,
# force-push, branch apagada - chega em producao sem passar por aqui.
# O PAT precisa de "Contents" e "Workflows" com escrita no -prd.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - Magic Card Game"]
    types: [completed]
    branches: [main]

# Dois merges seguidos: publica um de cada vez, na ordem.
concurrency:
  group: promote-prd
  cancel-in-progress: false

jobs:
  publicar-em-producao:
    # So push na main que passou em tudo. O filtro de branch do workflow_run
    # olha so o nome (um PR vindo da main de um fork casaria), e CI vermelho
    # nunca vira producao.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # O commit que o CI validou, nao o que estiver na ponta da main agora.
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Nomear a publicação
        run: echo "TAG=prd-$(date -u +%Y%m%d-%H%M)-${SHA::7}" >> "$GITHUB_ENV"

      - name: Conferir o token do repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          # Descoberto na v1.0.0: o secret existia com valor VAZIO (um
          # `gh secret set` sem stdin interativo). A mensagem do gh era
          # "set the GH_TOKEN environment variable", que manda procurar o bug
          # no workflow em vez de no secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRD_DISPATCH_TOKEN vazio ou ausente. Merge feito mas producao nao foi publicada."
            echo "Corrija com: gh secret set PRD_DISPATCH_TOKEN --repo ${GITHUB_REPOSITORY} --body '<pat>'"
            exit 1
          fi

      - name: Checkout do repo de produção
        uses: actions/checkout@v4
        with:
          repository: scudellerlemos/pipeline-databricks-mtg-prd
          token: ${{ secrets.PRD_DISPATCH_TOKEN }}
          path: .prd

      # Snapshot inteiro, com --delete: arquivo apagado aqui some la tambem.
      # .github/workflows fica de fora - os workflows DESTE repo (CI, deploy
      # de dev, esta promocao) nao podem rodar em producao. La so existe o
      # deploy-prd.yml, que vem da copia revisada em .github/prd/.
      - name: Publicar o snapshot no repo de produção
        run: |
          rsync -a --delete --exclude .git --exclude .prd --exclude .github/workflows ./ .prd/
          mkdir -p .prd/.github/workflows
          cp .github/prd/deploy-prd.yml .prd/.github/workflows/deploy-prd.yml
          cd .prd
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Commit vazio (ex.: force-push que so reescreveu mensagens) publica e
          # deploya, mas nao reprocessa: nenhum arquivo mudou.
          if git commit -q -m "Publica $TAG (dev $SHA)"; then
            echo "RODAR=true" >> "$GITHUB_ENV"
          else
            echo "Nada mudou desde a ultima publicacao."
            echo "RODAR=false" >> "$GITHUB_ENV"
          fi
          git tag "$TAG"
          git push -q origin HEAD:main "refs/tags/$TAG"
          echo "✅ $TAG publicada em pipeline-databricks-mtg-prd"

      - name: Disparar deploy no repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          gh api repos/scudellerlemos/pipeline-databricks-mtg-prd/dispatches --input - <<EOF
          {"event_type": "deploy-prd", "client_payload": {"tag": "${TAG}", "rodar": ${RODAR}}}
          EOF
          echo "Deploy de ${TAG} solicitado ao repo de producao."
