name: Promover tag para produção

# Este repo e o dono do CODIGO. Quem deploya producao e o repo de controle
# (pipeline-databricks-mtg-prd), que nao tem copia de nada: ele faz checkout
# DESTE repo na tag e roda o mesmo .github/scripts/deploy.py com as variaveis
# de prod. Por isso aqui so avisa - o unico arquivo copiado e o proprio
# workflow de la, que tem que morar no repo de controle.
on:
  push:
    tags: ['v*']

jobs:
  avisar-repo-de-producao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `git tag v9 && git push --tags` funciona em QUALQUER commit, inclusive
      # um que nunca virou PR e nunca passou pelo required check da main. Sem
      # esta checagem a tag e um desvio completo do portao de revisao.
      - name: Checkout com historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exigir que a tag esteja na main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME aponta pra um commit que nao esta na main."
            echo "Producao so roda codigo que passou pelo PR. Apague a tag, faca merge e tagueie de novo."
            exit 1
          fi
          echo "✅ $GITHUB_REF_NAME esta na main"

      # O workflow do repo de controle e a copia em .github/prd/, mas antes
      # so mudava na mao - e na v1.0.0 ficou sem o requests e o deploy caiu.
      # Sincroniza antes do dispatch: o deploy roda o workflow DESTA tag.
      # O PAT precisa de "Workflows: write" alem de "Contents: write".
      - name: Sincronizar workflow do repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
          ARQ: .github/workflows/deploy-prd.yml
        run: |
          [ -n "$GH_TOKEN" ] || exit 0  # o passo seguinte explica o secret vazio
          API=repos/scudellerlemos/pipeline-databricks-mtg-prd/contents/$ARQ
          SHA=$(gh api "$API" --jq .sha)
          if gh api "$API" --jq .content | base64 -d | cmp -s - .github/prd/deploy-prd.yml; then
            echo "Workflow de producao ja esta igual ao da $GITHUB_REF_NAME."
          else
            gh api -X PUT "$API" -f message="Sincroniza deploy-prd.yml da $GITHUB_REF_NAME" \
              -f content="$(base64 -w0 .github/prd/deploy-prd.yml)" -f sha="$SHA" --silent
            echo "Workflow de producao atualizado para o da $GITHUB_REF_NAME."
          fi

      - name: Disparar deploy no repo de produção
        env:
          # PAT com permissao de escrita no repo de controle. E o unico secret
          # que existe por causa da separacao em dois repos.
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          # Descoberto na v1.0.0: o secret existia com valor VAZIO (um
          # `gh secret set` sem stdin interativo). A mensagem do gh era
          # "set the GH_TOKEN environment variable", que manda procurar o bug
          # no workflow em vez de no secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRD_DISPATCH_TOKEN vazio ou ausente. A tag foi criada mas producao nao foi avisada."
            echo "Corrija com: gh secret set PRD_DISPATCH_TOKEN --repo ${GITHUB_REPOSITORY} --body '<pat>'"
            echo "Enquanto isso, deploye pelo workflow_dispatch do repo de controle."
            exit 1
          fi
          gh api repos/scudellerlemos/pipeline-databricks-mtg-prd/dispatches --input - <<EOF
          {"event_type": "deploy-prd", "client_payload": {"tag": "${GITHUB_REF_NAME}"}}
          EOF
          echo "Deploy de ${GITHUB_REF_NAME} solicitado ao repo de producao."
          echo "O workflow de la PARA no portao de aprovacao do environment Databricks-Prod."
