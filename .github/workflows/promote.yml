name: Promover tag para produção

# Merge na main que dispara o CI = producao. Quando o CI da main termina verde, copia o codigo
# desse commit pro repo pipeline-databricks-mtg-prd, cria a tag prd-<data>-<sha>
# (usada no rollback) e dispara o deploy de la.
# O PAT precisa de "Contents" e "Workflows" com escrita no -prd.

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - Magic Card Game"]
    types: [completed]
    branches: [main]

# Dois merges seguidos: publica um de cada vez, na ordem.
concurrency:
  group: promote-prd
  cancel-in-progress: false

jobs:
  publicar-em-producao:
    # So push na main com CI verde. O filtro de branch do workflow_run olha so o
    # nome, entao um PR vindo da main de um fork tambem casaria.
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # O commit que o CI validou, nao a ponta atual da main.
      - name: Checkout do commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Nomear a publicação
        run: echo "TAG=prd-$(date -u +%Y%m%d-%H%M)-${SHA::7}" >> "$GITHUB_ENV"

      - name: Conferir o token do repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          # Secret vazio faz o gh falhar com "set the GH_TOKEN environment
          # variable", que aponta pro workflow e nao pro secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRD_DISPATCH_TOKEN vazio ou ausente. Merge feito mas producao nao foi publicada."
            echo "Corrija com: gh secret set PRD_DISPATCH_TOKEN --repo ${GITHUB_REPOSITORY} --body '<pat>'"
            exit 1
          fi

      - name: Checkout do repo de produção
        uses: actions/checkout@v4
        with:
          repository: scudellerlemos/pipeline-databricks-mtg-prd
          token: ${{ secrets.PRD_DISPATCH_TOKEN }}
          path: .prd

      # Copia tudo com --delete (arquivo apagado aqui some la). .github/workflows
      # fica de fora (os workflows de dev nao podem rodar em prd); o unico workflow
      # de la e a copia de .github/prd/deploy-prd.yml.
      - name: Publicar o snapshot no repo de produção
        run: |
          rsync -a --delete --exclude .git --exclude .prd --exclude .github/workflows ./ .prd/
          mkdir -p .prd/.github/workflows
          cp .github/prd/deploy-prd.yml .prd/.github/workflows/deploy-prd.yml
          # O README e o de dev: badge passa a apontar pro deploy de prd e ganha
          # um aviso de que aqui e so o snapshot publicado.
          sed -i 's#pipeline-databricks-mtg-dev/actions/workflows/validate-pipeline.yml#pipeline-databricks-mtg-prd/actions/workflows/deploy-prd.yml#g' .prd/README.md
          sed -i '1r /dev/stdin' .prd/README.md <<'AVISO'

          > **Repositório de produção** (catálogo `mtg_prod`). Snapshot publicado
          > automaticamente de [`pipeline-databricks-mtg-dev`](https://github.com/scudellerlemos/pipeline-databricks-mtg-dev)
          > a cada merge na `main` de lá que dispara o CI. Não edite aqui: mudanças entram por PR em dev.
          AVISO
          cd .prd
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Reprocessa so se mudou algo alem de documentacao (*.md e docs/).
          # Sem mudanca ou so doc: publica e deploya a tag, mas nao roda o pipeline.
          # quotepath=off: sem isso o git poe entre aspas caminho com acento e o $ do regex nao casa.
          if git -c core.quotepath=off diff --cached --name-only | grep -qvE '\.md$|^docs/'; then
            echo "RODAR=true" >> "$GITHUB_ENV"
          else
            echo "Sem mudanca de codigo: publica sem rodar o pipeline."
            echo "RODAR=false" >> "$GITHUB_ENV"
          fi
          git commit -q -m "Publica $TAG (dev $SHA)" || echo "Nada mudou desde a ultima publicacao."
          git tag "$TAG"
          git push -q origin HEAD:main "refs/tags/$TAG"
          echo "$TAG publicada em pipeline-databricks-mtg-prd"

      - name: Disparar deploy no repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          gh api repos/scudellerlemos/pipeline-databricks-mtg-prd/dispatches --input - <<EOF
          {"event_type": "deploy-prd", "client_payload": {"tag": "${TAG}", "rodar": ${RODAR}}}
          EOF
          echo "Deploy de ${TAG} solicitado ao repo de producao."
