name: Promover tag para produção

# Publica a tag no repo de producao (pipeline-databricks-mtg-prd): copia o
# snapshot inteiro do codigo pra la, commita, tagueia com o mesmo nome e so
# entao dispara o deploy. Os jobs de prod leem de la, entao apagar ou mover
# tag, force-push ou qualquer liberdade que o dev tenha neste repo nao chega
# em producao. O PAT precisa de "Contents" e "Workflows" com escrita no -prd.

on:
  push:
    tags: ['v*']

jobs:
  avisar-repo-de-producao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `git tag v9 && git push --tags` funciona em QUALQUER commit, inclusive
      # um que nunca virou PR e nunca passou pelo required check da main. Sem
      # esta checagem a tag e um desvio completo do portao de revisao.
      - name: Checkout com historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exigir que a tag esteja na main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag $GITHUB_REF_NAME aponta pra um commit que nao esta na main."
            echo "Producao so roda codigo que passou pelo PR. Apague a tag, faca merge e tagueie de novo."
            exit 1
          fi
          echo "✅ $GITHUB_REF_NAME esta na main"

      - name: Conferir o token do repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          # Descoberto na v1.0.0: o secret existia com valor VAZIO (um
          # `gh secret set` sem stdin interativo). A mensagem do gh era
          # "set the GH_TOKEN environment variable", que manda procurar o bug
          # no workflow em vez de no secret.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRD_DISPATCH_TOKEN vazio ou ausente. A tag foi criada mas producao nao foi avisada."
            echo "Corrija com: gh secret set PRD_DISPATCH_TOKEN --repo ${GITHUB_REPOSITORY} --body '<pat>'"
            exit 1
          fi

      - name: Checkout do repo de produção
        uses: actions/checkout@v4
        with:
          repository: scudellerlemos/pipeline-databricks-mtg-prd
          token: ${{ secrets.PRD_DISPATCH_TOKEN }}
          path: .prd
          fetch-depth: 0

      # Snapshot inteiro, com --delete: arquivo apagado aqui some la tambem.
      # .github/workflows fica de fora - os workflows DESTE repo (CI, deploy
      # de dev, esta promocao) nao podem rodar em producao. La so existe o
      # deploy-prd.yml, que vem da copia revisada em .github/prd/.
      - name: Publicar o snapshot da tag no repo de produção
        run: |
          rsync -a --delete --exclude .git --exclude .prd --exclude .github/workflows ./ .prd/
          mkdir -p .prd/.github/workflows
          cp .github/prd/deploy-prd.yml .prd/.github/workflows/deploy-prd.yml
          cd .prd
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica $GITHUB_REF_NAME ($GITHUB_SHA)" || echo "Nada mudou desde a ultima publicacao."
          # Rerun da mesma promocao: a tag ja existe la e fica onde esta.
          git rev-parse -q --verify "refs/tags/$GITHUB_REF_NAME" >/dev/null || git tag "$GITHUB_REF_NAME"
          git push -q origin HEAD:main "refs/tags/$GITHUB_REF_NAME"
          echo "✅ $GITHUB_REF_NAME publicada em pipeline-databricks-mtg-prd"

      - name: Disparar deploy no repo de produção
        env:
          GH_TOKEN: ${{ secrets.PRD_DISPATCH_TOKEN }}
        run: |
          gh api repos/scudellerlemos/pipeline-databricks-mtg-prd/dispatches --input - <<EOF
          {"event_type": "deploy-prd", "client_payload": {"tag": "${GITHUB_REF_NAME}"}}
          EOF
          echo "Deploy de ${GITHUB_REF_NAME} solicitado ao repo de producao."
          echo "O workflow de la PARA no portao de aprovacao do environment Databricks-Prod."
