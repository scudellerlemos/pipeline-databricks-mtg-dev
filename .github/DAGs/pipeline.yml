resources:
  jobs:
    # Orquestrador: encadeia os jobs de camada via run_job_task. Cada camada
    # (Stage, Bronze, Silver, Gold) so comeca quando a anterior termina por
    # inteiro.
    #
    # job_id de cada run_job_task e um placeholder, substituido pelo ID real
    # do job no deploy (ver deploy.py).
    MTG_PIPELINE:
      name: MTG_PIPELINE
      description: "Orquestrador: Stage -> Bronze -> Silver -> Gold"
      schedule:
        # Executa 1x/mes, na 1a segunda-feira do mes, as 6h (Quartz: "2#1" =
        # dia-da-semana 2 (segunda) ocorrencia #1 no mes)
        quartz_cron_expression: "0 0 6 ? * 2#1"
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: rodar_stage
          run_job_task:
            job_id: "{{MTG_STAGE_JOB_ID}}"

        - task_key: rodar_bronze
          depends_on:
            - task_key: rodar_stage
          run_job_task:
            job_id: "{{MTG_BRONZE_JOB_ID}}"

        - task_key: rodar_silver
          depends_on:
            - task_key: rodar_bronze
          run_job_task:
            job_id: "{{MTG_SILVER_JOB_ID}}"

        - task_key: rodar_gold
          depends_on:
            - task_key: rodar_silver
          run_job_task:
            job_id: "{{MTG_GOLD_JOB_ID}}"

      tags:
        project: "MTG"
        environment: "development"
        team: "data-engineering"
        api_source: "scryfall"
        layer: "orquestrador"
